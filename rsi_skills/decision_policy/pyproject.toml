[project]
name = "dm-rsi-decision-policy"
version = "0.1.0"
description = "Decision Policy RSI: evaluate, diagnose and evolve how a trained decision model's scores become decisions"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dpolicy = "dpolicy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dpolicy"]
